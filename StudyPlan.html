<!DOCTYPE html>
<html lang = "en">
    <head>
        <link rel = "stylesheet" href = "StudyPlan.css">
        <title>StudyPlan</title>
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
    </head>
    <body>
        <h1 class = "head"> StudyPlan</h1>
        <main class = "main-page">
            <div class = "side-bar">
                <div class = "side-header">
                    <h2>To-Do:</h2>
                    <button class = "menu-hide">&lt;</button>
                </div>
            </div>
            <div class = "calendar-container">
                <div class = "calendar-header">
                    <button class = "nav-button">&lt;</button>
                    <h1>Month</h1>
                    <button class = "nav-button">&gt;</button>
                </div>
                <div class = "weekdays">
                    <div>Sun</div><div>Mon</div><div>Tues</div><div>Wed</div><div>Thurs</div><div>Fri</div><div>Sat</div>
                </div>
                <div class = "days">
                    <div style = "grid-column-start:6;" class = "day">1</div>
                    <div class = "day">2</div>
                    <div class = "day">3</div>
                    <div class = "day">4</div>
                    <div class = "day">5</div>
                    <div class = "day">6</div>
                    <div class = "day">7</div>
                    <div class = "day">8</div>
                    <div class = "day">9</div>
                    <div class = "day">10</div>
                    <div class = "day">11</div>
                    <div class = "day">12</div>
                    <div class = "day">13</div>
                    <div class = "day">14</div>
                    <div class = "day">15</div>
                    <div class = "day">16</div>
                    <div class = "day">17</div>
                    <div class = "day">18</div>
                    <div class = "day">19</div>
                    <div class = "day">20</div>
                    <div class = "day">21</div>
                    <div class = "day">22</div>
                    <div class = "day">23</div>
                    <div class = "day">24</div>
                    <div class = "day">25</div>
                    <div class = "day">26</div>
                    <div class = "day">27</div>
                    <div class = "day">28</div>
                    <div class = "day">29</div>
                    <div class = "day">30</div>
                    <div class = "day">31</div>
                </div>
            </div>
        </main>
    </body>
</html>
