<!DOCTYPE html>
<html lang = "en">
    <head>
        <link rel = "stylesheet" href = "StudyPlan.css">
        <title>StudyPlan</title>
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
    </head>
    <body>
        <h1 class = "head"> StudyPlan</h1>
        <main class = "main-page">
            <div id = "side-bar" class = "side-bar">
                <div class = "side-header">
                    <h2>To-Do:</h2>
                    <button id = "menu-hide" class = "menu-hide">&#9776;</button>
                </div>
            </div>
            <div id = "calendar-container" class = "calendar-container">
                <div class = "calendar-header">
                    <button id = "nav-left" class = "nav-button">&lt;</button>
                    <h1 id = "monthPlace"></h1>
                    <h1 id = "yearPlace"></h1>
                    <button id = "nav-right" class = "nav-button">&gt;</button>
                </div>
                <div class = "weekdays">
                    <div>Sun</div><div>Mon</div><div>Tues</div><div>Wed</div><div>Thurs</div><div>Fri</div><div>Sat</div>
                </div>
                <div id = "days" class = "days"></div>
            </div>
        </main>
        <script src = "StudyPlan.js"></script>
    </body>
</html>
